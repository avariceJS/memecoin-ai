name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make setup
      - run: make check
      - run: make smoke
      - run: make build

  ml-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv work/ml-venv
      - run: work/ml-venv/bin/python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: make ml-setup
      - run: make ml-check
