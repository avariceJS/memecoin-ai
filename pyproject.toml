[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memecoin-ai"
version = "0.1.0"
description = "Point-in-time trading research foundation; no live execution"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["torch==2.14.1", "numpy==2.5.3"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "hypothesis==6.168.0"]

[project.scripts]
mcai = "memecoin_ai.cli:main"
brain-linux-service = "memecoin_operator.linux_service:main"
brain-linux-release = "memecoin_operator.linux_release:main"
brain-linux-attachment = "memecoin_operator.linux_attachment:main"
brain-linux-handoff = "memecoin_operator.linux_handoff:main"
brain-linux-capabilities = "memecoin_operator.linux_capabilities:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/memecoin_ai", "src/memecoin_registry", "src/memecoin_research"]

[tool.setuptools.package-data]
memecoin_ai = ["py.typed"]
memecoin_research_storage = ["py.typed"]
